services:
  - type: static
    name: beqwik-frontend
    buildCommand: npx vite build
    publishPath: dist
    routes:
      # Rewrite all routes to index.html for client-side routing (React Router)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Environment variables used by Vite during the build phase.
      # Setting sync: false forces Render to prompt you for these values on creation.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
